- aid: uzum:uzum-payment-hub-baas
  name: Uzum BaaS Payment Hub
  description: >-
    Banking-as-a-Service JSON-RPC 2.0 API that lets partners embed payments, transfers and account and
    card operations inside Uzbekistan's national payment system. Covers account balance, history and attached-account
    listing, card binding and card lookup, merchant and merchant-category directories, and receipt creation
    for card-to-card, card-to-account, account-to-card, account-to-account and online card payments. HTTP
    Basic authentication over TLS 1.2. Documented as reference pages; no OpenAPI is published for this
    surface.
  humanURL: https://developer.uzumbank.uz/en/paymenthub/
  baseURL: ''
  tags:
  - Banking as a Service
  - JSON-RPC
  - Payments
  - Transfers
  properties:
  - type: Documentation
    url: https://developer.uzumbank.uz/en/paymenthub/
  - type: ErrorCatalog
    url: errors/uzum-paymenthub-error-codes.yml
- aid: uzum:uzum-market-seller
  name: Uzum Market Seller API
  description: >-
    Seller-cabinet API for Uzum Market used to synchronise marketplace orders, inventory and prices for
    both Fulfilment by Operator (FBO) and Fulfilment by Seller (FBS) models. Access requires an API token
    issued inside a seller's own Uzum Market Seller cabinet; the host answers 403 "RBAC: access denied"
    anonymously and the Swagger UI redirects to a Keycloak login, so no public contract is available.
  humanURL: https://seller.uzum.uz/
  baseURL: https://api-seller.uzum.uz
  tags:
  - E-Commerce
  - Marketplace
  - Order
  - Inventory
  tags_raw:
