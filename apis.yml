apis:
- aid: uzum-checkout
  name: Uzum Checkout
  description: >-
    Payment gateway for websites and mobile applications. Card payments (Visa, Mastercard,
    Uzcard, Humo), one-step and two-step authorization, back-to-back payment without the
    hosted form, card binding and recurring payments, full and partial refunds, reversal,
    and automatic receipt fiscalization. PCI DSS compliant. Authenticated with X-Terminal-Id
    and X-API-Key headers issued by Uzum Bank.
  humanURL: https://developer.uzumbank.uz/en/checkout
  baseURL: ''
  tags:
  - Payments
  - Acquiring
  - Cards
  - Refunds
  - Fiscalization
  properties:
  - type: OpenAPI
    url: openapi/uzum-checkout-openapi.yaml
  - type: Documentation
    url: https://developer.uzumbank.uz/en/checkout
- aid: uzum-crossborder-transfer
  name: Uzum CrossBorder Transfer
  description: >-
    International money transfer between Uzbekistan and other countries. Transfers to
    Uzbekistan by phone number or card number, transfers from Uzbekistan by card number,
    cross-border payments for services inside Uzbekistan, live FX conversion rates,
    transfer status checks, partner account balance and operation registry. HTTP Basic
    authentication issued per partner.
  humanURL: https://developer.uzumbank.uz/en/crossborder
  baseURL: https://crossborder.transfer.uz
  tags:
  - Money Transfer
  - Remittances
  - Cross-Border
  - Foreign Exchange
  tags_raw:
  - Money Transfer
  - Remittances
  - Cross Border
  - Foreign Exchange
  properties:
  - type: OpenAPI
    url: openapi/uzum-crossborder-openapi.yaml
  - type: Documentation
    url: https://developer.uzumbank.uz/en/crossborder
- aid: uzum-remit-core
  name: Remit Core
  description: >-
    Single integration point for cross-border remittances. Partners register, process,
    confirm, cancel and status-check CREDIT and DEBIT transfers; Remit Core handles
    routing, validation and interaction with national payment infrastructure. Also exposes
    FX conversion, recipient bank lookup by phone number, and partner balance. X-Api-Key
    header authentication; production connectivity is over IPSec.
  humanURL: https://developer.uzumbank.uz/en/remitcore
  baseURL: https://remit-core.ipt-merch.com
  tags:
  - Money Transfer
  - Remittances
  - Cross-Border
  tags_raw:
  - Money Transfer
  - Remittances
  - Cross Border
  properties:
  - type: OpenAPI
    url: openapi/uzum-remitcore-openapi.yaml
  - type: Documentation
    url: https://developer.uzumbank.uz/en/remitcore
  - type: Postman
    url: https://developer.uzumbank.uz/remitcore/remitcore_postman_collection_credit.json
- aid: uzum-nasiya-partner
  name: Uzum Nasiya Partner API
  description: >-
    REST API for partner integration with the Uzum Nasiya installment (BNPL) service.
    Buyer registration through an Uzum Nasiya WebView, buyer status and credit limit
    checks, basket pre-calculation of installment terms, contract creation, SMS-code
    activation, and contract confirmation or cancellation. Bearer token authentication.
  humanURL: https://developer.uzumbank.uz/en/nasiya
  baseURL: https://merchants-api.uzumnasiya.uz
  tags:
  - Buy Now Pay Later
  - Installments
  - Lending
  - Consumer Credit
  tags_raw:
  - BNPL
  - Installments
  - Lending
  - Consumer Credit
  properties:
  - type: OpenAPI
    url: openapi/uzum-nasiya-openapi.yaml
  - type: Documentation
    url: https://developer.uzumbank.uz/en/nasiya
- aid: uzum-fiscalization
  name: Uzum Fiscalization
  description: >-
    Fiscalizes sales and refund receipts and submits them to the Uzbekistan State Tax
    Committee through a Fiscal Data Operator. Generates receipt links, supports non-fiscal
    receipts for advance and credit payments, and accepts QR-code payment receipt data.
    Mandatory product-labeling arrays for regulated goods categories. API-key
    authentication issued per partner.
  humanURL: https://developer.uzumbank.uz/en/fiscalization
  baseURL: https://ofd-key.inplat-tech.com
  tags:
  - Fiscalization
  - Tax
  - Receipts
  - Compliance
  properties:
  - type: OpenAPI
    url: openapi/uzum-fiscalization-openapi.yaml
  - type: Documentation
    url: https://developer.uzumbank.uz/en/fiscalization
- aid: uzum-fast-pay
  name: Uzum Fast Pay
  description: >-
    Instant QR-code payments and payments through cash-register and POS / fiscal register
    systems, where the seller scans the customer's QR code from the Uzum Bank app. Payment
    processing, fiscalization, reversal and status check. Signed Authorization header of
    the form merchant_id:sha1_hash:timestamp.
  humanURL: https://developer.uzumbank.uz/en/fastpay
  baseURL: https://mobile.apelsin.uz
  tags:
  - Payments
  - QR Payments
  - Point-of-Sale
  tags_raw:
  - Payments
  - QR Payments
  - Point of Sale
  properties:
  - type: OpenAPI
    url: openapi/uzum-fastpay-openapi.yaml
  - type: Documentation
    url: https://developer.uzumbank.uz/en/fastpay
- aid: uzum-dynamic-qr
  name: Uzum Dynamic QR
  description: >-
    Dynamic QR payment for a QR code printed on a POS receipt or shown on a cash-register
    screen, scanned by the customer in the Uzum Bank mobile application. Order creation
    and payment-link generation, order and payment status checks, fiscalization, reversal
    and cancellation.
  humanURL: https://developer.uzumbank.uz/en/dynamicqr
  baseURL: https://mobile.apelsin.uz
  tags:
  - Payments
  - QR Payments
  - Point-of-Sale
  tags_raw:
  - Payments
  - QR Payments
  - Point of Sale
  properties:
  - type: OpenAPI
    url: openapi/uzum-dynamicqr-openapi.yaml
  - type: Documentation
    url: https://developer.uzumbank.uz/en/dynamicqr
- aid: uzum-merchant-api
  name: Uzum Merchant API
  description: >-
    Webhook protocol that lets partners accept payments from inside the Uzum Bank mobile
    application. Uzum Bank calls five partner-implemented webhooks — check, create,
    confirm, reverse and status — carrying payment data; the partner implements the
    handlers and returns responses per the specification. HTTP Basic authorization.
  humanURL: https://developer.uzumbank.uz/en/merchant
  baseURL: ''
  tags:
  - Payments
  - Webhook
  - Billing
  tags_raw:
  - Payments
  - Webhooks
  - Billing
  properties:
  - type: OpenAPI
    url: openapi/uzum-merchant-openapi.yaml
  - type: Webhooks
    url: asyncapi/uzum-merchant-webhooks.yml
  - type: Documentation
    url: https://developer.uzumbank.uz/en/merchant
- aid: uzum-ratekeeper
  name: Uzum RateKeeper
  description: >-
    Partner-facing foreign-exchange rate service. Converts an amount between currencies at
    the current Uzum rate and returns the partner's conversion limits. Documented on the
    Uzum Bank developer portal as rate-keeper-back.
  humanURL: https://developer.uzumbank.uz/en/ratekeeper
  baseURL: ''
  tags:
  - Foreign Exchange
  - Rates
  properties:
  - type: OpenAPI
    url: openapi/uzum-ratekeeper-openapi.yaml
  - type: Documentation
    url: https://developer.uzumbank.uz/en/ratekeeper
- aid: uzum-payment-hub-baas
  name: Uzum BaaS Payment Hub
  description: >-
    Banking-as-a-Service JSON-RPC 2.0 API that lets partners embed payments, transfers and
    account and card operations inside Uzbekistan's national payment system. Covers
    account balance, history and attached-account listing, card binding and card lookup,
    merchant and merchant-category directories, and receipt creation for card-to-card,
    card-to-account, account-to-card, account-to-account and online card payments. HTTP
    Basic authentication over TLS 1.2. Documented as reference pages; no OpenAPI is
    published for this surface.
  humanURL: https://developer.uzumbank.uz/en/paymenthub/
  baseURL: ''
  tags:
  - Banking as a Service
  - JSON-RPC
  - Payments
  - Transfers
  properties:
  - type: Documentation
    url: https://developer.uzumbank.uz/en/paymenthub/
  - type: ErrorCatalog
    url: errors/uzum-paymenthub-error-codes.yml
- aid: uzum-market-seller
  name: Uzum Market Seller API
  description: >-
    Seller-cabinet API for Uzum Market used to synchronise marketplace orders, inventory
    and prices for both Fulfilment by Operator (FBO) and Fulfilment by Seller (FBS)
    models. Access requires an API token issued inside a seller's own Uzum Market Seller
    cabinet; the host answers 403 "RBAC: access denied" anonymously and the Swagger UI
    redirects to a Keycloak login, so no public contract is available.
  humanURL: https://seller.uzum.uz/
  baseURL: https://api-seller.uzum.uz
  tags:
  - E-Commerce
  - Marketplace
  - Order
  - Inventory
  tags_raw:
  - E-Commerce
  - Marketplace
  - Orders
  - Inventory
  properties:
  - type: Documentation
    url: https://seller.uzum.uz/
