aid: uzum
name: Uzum
description: 'Uzum is an Uzbekistan-based digital ecosystem headquartered in Tashkent that bundles e-commerce,
  fintech and digital banking into a single group: Uzum Market (the country''s largest online marketplace),
  Uzum Tezkor (rapid food and grocery delivery), Uzum Bank (a licensed digital bank), and Uzum Nasiya
  (consumer BNPL / installment lending). Its developer-facing API surface is published by Uzum Bank at
  developer.uzumbank.uz, where nine OpenAPI contracts and a JSON-RPC 2.0 Banking-as-a-Service hub cover
  card acquiring (Uzum Checkout), QR and cash-register payments (Uzum Fast Pay, Dynamic QR), tax receipt
  fiscalization to the Uzbek State Tax Committee (Uzum Fiscalization), inbound and outbound cross-border
  money transfer (Uzum CrossBorder Transfer, Remit Core), installment contract origination (Uzum Nasiya
  Partner API), in-app merchant billing (Merchant API webhooks) and FX rate quoting (RateKeeper). Uzum
  Market additionally operates a seller-cabinet API at api-seller.uzum.uz for FBO/FBS order, inventory
  and price synchronization, which is credential-gated. All Uzum Bank API programs are onboarded through
  an account manager rather than self-service signup.'
url: https://raw.githubusercontent.com/api-evangelist/uzum/refs/heads/main/apis.yml
x-type: company
x-source: harvest:secondary-market
