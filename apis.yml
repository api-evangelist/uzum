- aid: uzum:uzum-fiscalization-api
  name: Uzum Fiscalization API
  description: >-
    In this section, the API provides methods for working with fiscal receipts.


    `/v2/receipt` method allows you to register a sale operation and generate a fiscal receipt that complies
    with all legal requirements.


    `/v2/refund_receipt` method is designed for registering return transactions for goods or services.
    Similar to the direct receipt fiscalization method, it ensures the generation of a fiscal receipt
    for the return that also meets all regulatory requirements and can be provided to the customer.


    `/v2/receipt/{operation_id}/receipt_url` method provides the ability to obtain an electronic copy
    of the fiscal receipt using the unique operation identifier.
  humanURL: https://developer.uzumbank.uz/en/checkout
  baseURL: https://crossborder.transfer.uz
