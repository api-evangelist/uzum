    info_version: 1.10.3
    path_prefix: /api/v1
  - api: Uzum CrossBorder Transfer
    info_version: 0.1.0
    path_prefix: /cbt/v1
  - api: Remit Core
    info_version: 1.0.4
    path_prefix: /v1 and /info/v1
  - api: Uzum Nasiya Partner API
    info_version: 1.0.2
    path_prefix: /api/v1 and /v3
    note: The SMS activation methods sit on a bare /v3 prefix while the contract methods sit on /api/v1.
  - api: Uzum Fiscalization
    info_version: 0.0.2
    path_prefix: /v2
  - api: Uzum Fast Pay
    info_version: v2
    path_prefix: /api/apelsin-pay/merchant/v2 and unversioned /api/apelsin-pay/merchant
    note: Payment and reversal are v2; fiscal and status are unversioned on the same contract.
  - api: Uzum Dynamic QR
    info_version: 1.0.0
    path_prefix: /api/dynamic-qr
    note: No version segment in the path at all.
  - api: Uzum Merchant API
    info_version: 1.0.0
    path_prefix: partner-implemented webhook paths
  - api: Uzum RateKeeper
    info_version: 0.0.1
    path_prefix: /api/v1
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  note: >-
    No deprecation policy, no Sunset or Deprecation response headers, and no operation in any
    of the nine contracts carries `deprecated: true`. Breaking changes are announced as prose:
    the Fiscalization contract records a mandatory March 1 2024 product-labeling change that
    added a required `labels` array to items on /v2/receipt and /v2/refund_receipt and rejects
    non-conforming receipts, with no versioned alternative and no transition window. Because
    no policy exists, NO `Deprecation` pointer is emitted in apis.yml.
