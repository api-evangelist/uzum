    TransferResponse:
      required:
        - completedDateTime
        - createdDateTime
        - exchangeRate
        - externalTransferId
        - receiverPaymentSystem
        - receiverAmount
        - senderAmount
        - senderCurrencyCode
        - status
        - transferId
        - transferType
      type: object
      properties:
