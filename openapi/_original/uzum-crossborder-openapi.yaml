    description: Methods for transfers from Uzbekistan
  - name: To Uzbekistan
    description: Methods for transfers to Uzbekistan
  - name: Cross-border payments
    description: Methods for cross-border payments for services in Uzbekistan
  - name: Testing
    description: >
      API integration testing ensures proper interaction between systems and
      identifies and resolves errors in data exchange.


      Follow the steps below to ensure correct interaction:

      1. Obtain the login and password for the test environment from the Uzum
      Bank manager.

      2. Use the test environment: crossborder-transfer.ub.ufintech.uz

      3. Go through test scenarios. We prepared scenarios for transfers to
      Uzbekistan in <a href='/crossborder/en_cbt_test_cases_partners.pdf'
      target='_blank'>English</a> and a Postman <a
      href='/crossborder/ru_cbt_test_cases_partners_postman_collection.json'
      target='_blank'>collection</a>.

      4. Payment test scenarios for cross-border payments for services in
      Uzbekistan are available for <a
      href='/crossborder/en_cbt_payment_test_cases_mocks.pdf'
      target='_blank'>mock testing</a> and <a
      href='/crossborder/en_cbt_payment_test_cases_integration.pdf'
      target='_blank'>real integration with suppliers</a>.

      ⚠️ Before running the mock test cases, contact your Uzum Bank manager.
  - name: Error Codes
    description: "This section lists error codes that can be returned by the API. Use the error code together with the method that returned it to determine the reason for the failure and the required handling on the partner side.\n\nError codes for **transfers** start with `1` and have the `1xxxx` format.\n\nError codes for **cross-border payments** start with `2` and have the `2xxxx` format.\n\n- [Transfer error codes](#section/Error-Codes/Transfer-error-codes)\n- [Cross-border payment error codes](#section/Error-Codes/Cross-border-payment-error-codes)\n\n## Transfer error codes\n\n| Error Code | Error Message | Error Description | Returns From |\n|------------|-----------------------------------------------------------------------|-------------------------------------|-------------|\n| 10001      | Authorization Error. Access denied.                                   | Error in the specified credentials. Login/password is missing from the request or provided incorrectly. | All methods |\n| 10002      | Validation Error + reason in errorDetails.                            | Data format error. Missing required parameters in the request. Data validation error. | All methods |\n| 10005      | Service Error.                                                         | Unexpected internal error during request processing. | All methods |\n| 10006      | Access denied. This method is not available.                          | Attempt to call a method unavailable to the partner. | Credit methods if only transfers from Uzbekistan are agreed in the contract. </br> Debit methods if only transfers to Uzbekistan are agreed in the contract. |\n| 10101      | Service Error.                                                         | Error in one of Uzum's internal services accessed by CrossBorder Transfer service during operation. | /check_credit</br>/confirm_credit</br>/receiver_banks</br>/check_debit</br>/confirm_debit</br>/convert</br>/account/operations</br>/account/closing_balance |\n| 10201      | Sender Check Failed.                                                   | Sender failed blacklist check.            | /check_credit </br> /check_debit |\n| 10202      | Receiver Check Failed.                                                 | Recipient failed blacklist check.         | /check_credit </br> /check_debit |\n| 10203      | Receiver cards not found.                                              | Receiver’s cards not found based on the request data. | /check_credit |\n| 10204      | Receiver card payment system not supported                            | Receiver’s card must belong to HUMO, Uzcard, or Visa Uzum Bank payment systems. | /check_credit |\n| 10208      | Exchange rate changed or incorrect amounts                            | Exchange rate has changed since the /check call or incorrect amounts were provided. | /confirm_credit </br> /confirm_debit |\n| 10209      | One-Time limit exceeded                                              | Attempt to transfer an amount that exceeds the one-time transaction limit. | /check_credit</br>/confirm_debit</br>/check_debit</br>/confirm_debit |\n| 10210      | Monthly limit exceeded                                                | Attempt to transfer an amount that exceeds the monthly limit. | /check_credit</br>/confirm_debit</br>/check_debit</br>/confirm_debit |\n| 10211      | Transfer already exists                                               | Attempt to check an existing transfer. Provided transfer ID is not unique. | /check_credit </br> /check_debit |\n| 10212      | Transfer not found                                                   | Transfer with the specified ID not found. | /confirm_credit</br>/confirm_debit</br>/status</br>/resend_otp</br>/cancel_debit |\n| 10220      | Transfer not approved                                                | Attempt to confirm an operation in an incorrect status | |\n| 10221      | Transfer expired.                                                      | Confirmation request received 20 or more minutes after a successful transfer verification request. | /confirm_credit</br>/resend_otp</br>/confirm_debit |\n| 10222      | Limit check failed.                                                   | Limits are not set for the partner. | All methods |\n| 10224      | Error during crediting transfer.                                       | Error during crediting funds.         | /confirm_credit |\n| 10225      | Receiver bank not found.                                              | The specified receiver card was not found in the specified bank. | /check_credit |\n| 10227      | Transfer status must be SUCCESS to reverse.                          | Attempt to cancel a debit-transfer that is not in SUCCESS status. | /cancel_debit |\n| 10228      | Sender card payment system not supported.                             | The payment system for the Sender’s card must be HUMO, Uzcard or Visa Uzum Bank. | /check_debit |\n| 10301      | Sender card not found.                                                | Sender's debit card not found in the payment processing. | /check_debit </br> /resend_otp |\n| 10302      | Payment Processing Temporary Unavailable.                              | Payment processing is temporarily unavailable. Try again later. | /check_debit </br> /resend_otp </br> /confirm_debit |\n| 10303      | Sender bank not found.                                                | The specified sender card was not found in the specified bank. | /check_debit |\n| 10310      | OTP Expired.                                                          | OTP has expired. A new OTP needs to be requested. | /confirm_debit |\n| 10311      | OTP incorrect. Try again.                                             | Incorrect OTP specified; There are remaining attempts for retry. | /confirm_debit |\n| 10312      | OTP incorrect. Attempts exceeded. Transfer failed.                    | Incorrect OTP specified; There are no remaining attempts for retry. |  /confirm_debit </br> /resend_otp |\n| 10316      | Error during debiting transfer.                                       | An error occurred during the debit execution in the payment processing. | /confirm_debit |\n| 11001      | Account not found.                                                    | The method for retrieving the closing balance or obtaining an account statement was called with an incorrect account number. | /account/closing_balance </br> /account/operations |\n| 11002      | The requested period exceeds the allowed limit of [PERIOD] days.      | The number of days in the interval specified in the request for retrieving the Partner's account statement has been exceeded. | /account/operations |\n| 11003      | The operation is in progress. Please try again in a few minutes.\t     | The allowed number of requests for the method to get balance information or account statement has been exceeded. | /account/closing_balance </br> /account/operations |\n| 10102      | Not supported for the predefined exchange rate source.\t                | Partner using the custom exchange rate scenario has called one of the debit methods for Uz cards or the /convert method. | /convert |\n| 10240      | Receiver banks not found.\t                                            | No recipient banks were found that issued cards linked to the specified phone number. | /receiver_banks |\n| 10230      | Daily quantity limit exceeded.\t                                        | Attempt to make more than 5 transfers to the recipient's card within a day (to Uzbekistan). Attempt to make more than 5 transfers within a day from the sender's card (from Uzbekistan). | /check_credit</br>/confirm_debit</br>/check_debit</br>/confirm_debit |\n| 10231      | Monthly quantity limit exceeded.\t                                      | Attempt to make more than 150 transfers to the recipient's card within a month (to Uzbekistan). Attempt to make more than 150 transfers within a month from the sender's card (from Uzbekistan). | /check_credit</br>/confirm_debit</br>/check_debit</br>/confirm_debit |\n| 10317      | The client's phone number does not match the phone number registered for card notification services. | The phone number provided in the request body does not match the phone number linked to the card.\t| /check_debit |\n| 10401      | Card is blocked or restricted by processing | The card is blocked or restricted on the processing side | Returned in the `error` block within an HTTP 200 translation response. Contains the reason why the translation transitioned to the `FAILED` status. |\n| 10402      | Card is expired, inactive or not found in processing | The card has expired, is inactive, or cannot be found in the processing system | Returned in the `error` block within an HTTP 200 translation response. Contains the reason why the translation transitioned to the `FAILED` status. |\n| 10403      | Processing limit exceeded | According to processing, the applicable limits for this operation have been exceeded | Returned in the `error` block within an HTTP 200 translation response. Contains the reason why the translation transitioned to the `FAILED` status. |\n| 10404      | Operation declined by processing antifraud system | The operation was identified by processing as potentially fraudulent and was declined by the processing antifraud system | Returned in the `error` block within an HTTP 200 translation response. Contains the reason why the translation transitioned to the `FAILED` status. |\n| 10405      | Processing error during crediting transfer | An error occurred on the processing side while performing the crediting operation | Returned in the `error` block within an HTTP 200 translation response. Contains the reason why the translation transitioned to the `FAILED` status. |\n| 10406      | Insufficient funds detected by processing | According to processing, there are insufficient funds on the sender’s card to complete this operation | Returned in the `error` block within an HTTP 200 translation response. Contains the reason why the translation transitioned to the `FAILED` status. |\n| 10407      | Processing error during debiting transfer | An error occurred on the processing side while performing the debit operation | Returned in the `error` block within an HTTP 200 translation response. Contains the reason why the translation transitioned to the `FAILED` status. |\n\n## Cross-border payment error codes\n\n| Error Code | Error Message | Error Description | Returns From |\n|------------|---------------|-------------------|-------------|\n| 20101      | Service not found | The service with the specified ID was not found. | /check_payment</br>/check_service |\n| 20102      | Service not active | The service is not available for payment. | /check_payment</br>/check_service |\n| 20103      | Service not active | The service is not available for payment. | /confirm_payment</br>/check_payment |\n| 20104      | Service not available now | Payment for this service is temporarily unavailable. | /confirm_payment</br>/check_payment |\n| 20105      | Invalid service parameters | The service payment parameters are invalid. | /check_payment</br>/confirm_payment |\n| 20200      | Payment forbidden | Payment for this service is forbidden. | /confirm_payment |\n| 20201      | Payment already exists | Attempt to check an existing payment. The provided payment ID is not unique. | /check_payment |\n| 20202      | Transfer not found | Payment with the specified ID was not found. | /confirm_payment</br>/payment/status |\n| 20203      | Payment not approved | Attempt to confirm a payment in an invalid status. | /confirm_payment |\n| 20204      | Payment expired | The confirmation request was received 20 or more minutes after the successful payment check request. | /confirm_payment |\n| 20205      | Payment failed | An error occurred while processing the service payment. | /confirm_payment</br>/check_payment |\n| 20206      | Invalid payment amount | The payment amount is invalid. | /confirm_payment</br>/check_payment |\n| 20207      | Client number not found | The client number was not found. | /confirm_payment</br>/check_payment |\n| 20208      | Number does not exist | The number does not exist. | /confirm_payment</br>/check_payment |\n| 20209      | Invalid phone number | The phone number is invalid. | /confirm_payment</br>/check_payment |\n| 20210      | Payment declined by antifraud system | The payment was declined by the antifraud system. | /confirm_payment</br>/check_payment |\n| 20211      | Payer verification failed | The payer failed the check. | /check_payment</br>/check_service |\n"
paths:
  /cbt/v1/payment/check_service:
    post:
      tags:
        - Cross-border payments
      summary: Get Information About the Future Payment Amount
      description: >
        This method is optional. Use `/check_service` when the selected service
        requires checking the details and receiving a specific payment amount.


        First, get the `serviceId` and the set of fields required to pay for the
        service.


        If the service allows an arbitrary amount, `/check_service` can be
        skipped and the payment can be created immediately using
        `/check_payment`.
      operationId: checkService
      requestBody:
        description: Data for checking the service
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckServiceRequest'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckServiceResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /cbt/v1/payment/check_payment:
    post:
      tags:
        - Cross-border payments
      summary: Run Pre-payment Checks and Create a Cross-border Payment
      description: >-
        Check the user, the availability of the selected service, and create a
        payment operation. First, get the `serviceId` and the set of fields
        required to pay for the service. <br><br>The `paymentAmount` is always
        expected in UZS.
      operationId: checkPayment
      requestBody:
        description: Data for creating the payment
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckPaymentRequest'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckPaymentResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /cbt/v1/payment/confirm_payment:
    post:
      tags:
        - Cross-border payments
      summary: Confirm a Cross-border Payment
      description: Confirm execution of a cross-border payment.
      operationId: confirmPayment
      requestBody:
        description: Data for confirming the payment
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /cbt/v1/payment/status:
    post:
      tags:
        - Cross-border payments
      summary: Get Payment Status
      description: Get the current status of a cross-border payment.
      operationId: getPaymentStatus
      requestBody:
        description: Data for getting the payment status
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /cbt/v1/payment/service_list:
    post:
      tags:
        - Cross-border payments
      summary: Get the List of Services Available for Payment
      description: >
        The method returns the services available to the partner for payment,
        including the set of fields required for each service.


        The response can be stored on the partner side. There is no need to
        request all service fields for every payment attempt.
      operationId: getServiceList
      requestBody:
        required: true
        description: Data for getting the list of available services
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceListRequest'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /cbt/v1/payment/payment_list:
    post:
      tags:
        - Cross-border payments
      summary: Get Payment Registry
      description: Get the payment registry by filter for the last 2 months.
      operationId: getPaymentList
      requestBody:
        required: true
        description: Filter for getting payments
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentListRequest'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentListResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /cbt/v1/transfer/card_list:
    post:
      tags:
        - To Uzbekistan
      summary: Retrieve the list of cards by phone number
      description: >-
        This method is available by agreement only. To activate it, please
        contact your Uzum Bank manager.
      operationId: getReceiverCardsByPhone
      requestBody:
        description: JSON object with request parameters.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiverCardsByPhoneRequest'
      responses:
        '200':
          description: description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiverCardsByPhoneResponse'
        '400':
          description: Error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /cbt/v1/transfer/card:
    post:
      tags:
        - To Uzbekistan
      summary: Retrieve card information by PAN
      description: >-
        This method is available by agreement only. To activate it, please
        contact your Uzum Bank manager.
      operationId: getReceiverCardsByPAN
      requestBody:
        description: JSON object containing request parameters.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiverCardsByPANRequest'
      responses:
        '200':
          description: description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '400':
          description: Error object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /cbt/v1/transfer/receiver_banks:
    post:
      tags:
        - To Uzbekistan
      operationId: getReceiverBanksList
      summary: Get the recipient's list of banks
      description: >-
        Returns a list of banks where the Recipient has active cards linked to
        the specified phone number.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiverBanksRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiverBanksResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No banks found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Service Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /cbt/v1/transfer/check_debit:
    post:
      tags:
        - From Uzbekistan
      summary: Register Transfer from Uzbekistan and Send OTP
      operationId: checkDebit
      requestBody:
        description: JSON object with request parameters.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckDebitRequest'
        required: true
      responses:
        '200':
          description: description
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CheckDebitResponse'
                  - type: object
                    properties:
                      error:
                        $ref: '#/components/schemas/Error'
        '400':
          description: Error object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /cbt/v1/transfer/resend_otp:
    post:
      tags:
        - From Uzbekistan
      summary: Resend OTP
      operationId: resendOTP
      requestBody:
        description: JSON object with request parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOTPRequest'
        required: true
      responses:
        '200':
          description: description
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CheckDebitResponse'
                  - type: object
                    properties:
