      properties:
        externalTransferId:
          type: string
          description: Payment identificator on the partner's side.
          example: a7dc3714-eb07-4ef9-bf97-a1f2b1af219b
        transferId:
          type: string
          description: Payment identificator on the Uzum Crossborder Transfer side
          format: uuid
          example: a7dc3714-eb07-4ef9-bf97-a1f2b1af219b
    TransferStatusRequest:
      required:
        - externalTransferId
      type: object
      properties:
        externalTransferId:
          type: string
          description: Transfer ID in the partner's system
          example: a7dc3714-eb07-4ef9-bf97-a1f2b1af219b
    TransferStatusResponse:
      required:
        - completedDateTime
        - createdDateTime
        - exchangeRate
        - externalTransferId
        - receiverPaymentSystem
        - receiverAmount
        - senderAmount
        - senderCurrencyCode
        - status
        - transferId
        - transferType
      type: object
      properties:
        rrn:
          description: Reference Retrieval Number
          type: string
          example: '524818898472'
        externalTransferId:
          type: string
          description: Transfer ID in the partner's system
          example: a7dc3714-eb07-4ef9-bf97-a1f2b1af219b
        transferId:
          type: string
          description: Transfer ID in the Uzum Crossborder Transfer system
          format: uuid
          example: a7dc3714-eb07-4ef9-bf97-a1f2b1af219b
        senderAmount:
          type: integer
          description: Amount sent by the payment sender in minimum currency units
          example: 40000
        senderCurrencyCode:
          type: string
          description: Currency of the payment sender (ISO 4217 alphabetic code)
          enum:
            - UZS
            - RUB
            - USD
            - EUR
            - TJS
        receiverAmount:
          type: integer
          description: Amount received by the recipient in minimum currency units
          example: 13640000
        receiverCurrencyCode:
          type: string
          description: Currency of the payment recipient (ISO 4217 alphabetic code)
          example: UZS
          enum:
            - UZS
            - RUB
            - USD
            - EUR
            - TJS
        receiverPaymentSystem:
          type: string
          description: Payment system in Uzbekistan
          enum:
            - HUMO
            - UZCARD
            - MASTERCARD
            - VISA
        exchangeRate:
          type: string
          description: Conversion rate from senderCurrencyCode to receiverCurrencyCode
          example: '113.5105'
        transferType:
          type: string
          description: Transfer direction
          example: TO_UZ
          enum:
            - FROM_UZ
            - TO_UZ
        createdDateTime:
          type: string
          description: Date and time of the transfer registration in the bank's system
          format: date-time
          example: '2024-10-19T09:55:30.250'
        completedDateTime:
          type: string
          description: Date and time of the transfer execution
          format: date-time
          example: '2024-10-19T10:55:30.250'
        status:
          type: string
          description: Transfer status
          example: SUCCESS
          enum:
            - REGISTERED
            - PENDING
            - APPROVED
            - SUCCESS
            - FAILED
            - REVERSED
        cardToken:
          type: string
          description: Card token
          example: vlKeomyUYGh8ktD+1hvI68kuApMKq1s8uyfgvHA=
    TransferListRequest:
      required:
        - createTime
        - limit
        - page
      type: object
      properties:
        createTime:
          description: Object with creation time filters
          allOf:
            - $ref: '#/components/schemas/FilterTime'
        status:
          type: string
          description: >-
            Operation status. If operations are to be retrieved in all statuses,
            this field is not specified in the request body
          example: APPROVED
          enum:
            - REGISTERED
            - PENDING
            - APPROVED
            - SUCCESS
            - FAILED
            - REVERSED
        transferType:
          type: string
          description: Transfer direction
          example: TO_UZ
          enum:
            - FROM_UZ
            - TO_UZ
        page:
          type: integer
          description: Requested response page number
          example: 1
          default: 1
        limit:
          type: integer
          description: Number of response records per page. Maximum - 100
          example: 25
          default: 25
    FilterTime:
      required:
        - from
        - to
      type: object
      properties:
        from:
          type: string
          description: Start date and time for filtering in UTC
          example: '2024-10-19T09:55:30.250'
        to:
          type: string
          description: End date and time for filtering in UTC
          example: '2024-10-22T09:55:30.250'
    TransferListResponse:
      type: array
      items:
        $ref: '#/components/schemas/TransferResponse'
    CheckDebitRequest:
      required:
        - externalTransferId
        - receiver
        - receiverAccount
        - receiverCountry
        - receiverCurrencyCode
        - sender
        - senderAmount
        - senderCurrencyCode
        - phone
      type: object
      properties:
        clientId:
          type: string
          description: Client ID in the partner's system.
          example: a7dc3714-eb07-4ef9-bf97-a1f2b1af219b
        externalTransferId:
          type: string
          description: Transfer ID in the partner’s system.
          example: a7dc3714-eb07-4ef9-bf97-a1f2b1af219b
        receiverAccount:
          type: string
          description: Masked recipient’s card number or account number.
          example: 553609******2598
        senderCardToken:
          type: string
          description: >-
            Card token. Not sent if senderCardPan and senderCardExpireDate are
            provided.
          nullable: true
          example: vlKeomyUYGh8ktD+1hvI68kuApMKq1s8uyfgvHA=
        senderCardPan:
          type: string
          description: Card PAN. Not sent if senderCardToken is provided.
          nullable: true
          example: '5536123443212699'
        senderCardExpireDate:
          type: string
          description: >-
            Card expiration date in the format YYMM. Not sent if senderCardToken
            is provided.
          nullable: true
          example: '2811'
        senderAmount:
          type: integer
          description: Sender’s payment amount in the minimal currency units.
          example: 13640000
        senderCurrencyCode:
          type: string
          description: Sender’s payment currency (ISO 4217 alphabetic code)
          example: UZS
          enum:
            - UZS
            - RUB
            - USD
            - EUR
            - TJS
        receiverAmount:
          type: integer
          description: Recipient’s payment amount in the smallest currency units.
          example: 40000
        receiverCurrencyCode:
          type: string
          description: Recipient’s payment currency (ISO 4217 alphabetic code).
          example: RUB
          enum:
            - UZS
            - RUB
            - USD
            - EUR
            - TJS
        exchangeRate:
          type: string
          description: Conversion rate from senderCurrencyCode to receiverCurrencyCode.
          example: '0.00000756'
        sender:
          $ref: '#/components/schemas/SenderInfo'
        receiver:
          $ref: '#/components/schemas/ReceiverInfo'
        receiverCountry:
          maxLength: 2
          minLength: 2
          type: string
          description: >-
            Recipient’s country (two-letter country code according to ISO 3166-1
            Alpha-2).
          example: RU
        phone:
          description: Sender’s phone number linked to the specified card.
          type: string
          pattern: \d{12}
        smsHash:
          description: SMS Hash
          type: string
          example: 2asio1
    CardToken:
      required:
        - cardToken
      type: object
      properties:
        cardToken:
          type: string
          description: Card token
          example: vlKeomyUYGh8ktD+1hvI68kuApMKq1s8uyfgvHA=
    CheckDebitResponse:
      required:
        - externalTransferId
        - status
        - transferId
      type: object
      properties:
        externalTransferId:
          type: string
          description: Transfer ID on the partner's side
          example: a7dc3714-eb07-4ef9-bf97-a1f2b1af219b
        transferId:
          type: string
          description: Transfer ID on the Crossborder Transfer side
          format: uuid
          example: a7dc3714-eb07-4ef9-bf97-a1f2b1af219b
        senderAmount:
          type: integer
          description: Sender's payment amount in minimal units
          example: 13640000
        senderCurrencyCode:
          type: string
          description: Sender's payment currency (ISO 4217 alphabetical code)
          example: UZS
          enum:
            - UZS
            - RUB
            - USD
            - EUR
            - TJS
        receiverAmount:
          type: integer
          description: Recipient's payment amount in minimal units
          example: 40000
        receiverCurrencyCode:
          type: string
          description: Recipient's currency (ISO 4217 alphabetical code)
          example: RUB
          enum:
            - UZS
            - RUB
            - USD
            - EUR
            - TJS
        exchangeRate:
          type: string
          description: Conversion rate from senderCurrencyCode to receiverCurrencyCode
          example: '0.00000756'
        status:
          type: string
          description: Transfer status
          example: APPROVED
          enum:
            - REGISTERED
            - PENDING
            - APPROVED
            - SUCCESS
            - FAILED
            - REVERSED
    ConfirmDebitRequest:
      required:
        - code
        - externalTransferId
      type: object
      properties:
        externalTransferId:
          type: string
          description: Transfer ID in the partner's system
          example: a7dc3714-eb07-4ef9-bf97-a1f2b1af219b
        code:
          pattern: '[0-9a-zA-Z]{4,6}'
          type: string
          description: OTP code
          example: '77777'
    CancelDebitRequest:
      required:
        - externalTransferId
      type: object
      properties:
        externalTransferId:
          type: string
          description: Transfer ID in the partner's system
          example: a7dc3714-eb07-4ef9-bf97-a1f2b1af219b
        reason:
          type: string
          description: Cancelation reason
          example: Debiting error
    ResendOTPRequest:
      required:
        - externalTransferId
      type: object
      properties:
        externalTransferId:
          type: string
          description: Transfer ID in the partner's system
          example: a7dc3714-eb07-4ef9-bf97-a1f2b1af219b
        smsHash:
          description: SMS Hash
          type: string
          example: 2asio1
    inline_response_200:
      type: object
      properties:
        paginationResponse:
          $ref: '#/components/schemas/PaginationResponse'
        transferList:
          $ref: '#/components/schemas/TransferListResponse'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
