        - type
        - title
      type: object
      properties:
        key:
          type: string
          description: Field key
          examples:
            - soato
        title:
          type: string
          description: Field name
          examples:
            - District
        type:
          type: string
          description: >-
            Field type: `S` — string, `N` — number, `E` — selection from the
            `values` dictionary.
          enum:
            - S
            - 'N'
            - E
        regex:
          type: string
          nullable: true
          examples:
            - ^[a-zA-Z0-9\-]{4,18}$
        values:
          description: Field value dictionary
          type: array
          items:
            $ref: '#/components/schemas/ServiceFieldValue'
    ServiceFieldValue:
      type: object
      description: Field value dictionary item
      required:
        - code
      properties:
        code:
          type: string
          description: Dictionary item value
          examples:
            - '22201'
            - '22202'
            - '22204'
            - '22206'
        name:
          type: string
          description: Dictionary item name
          examples:
            - Altynsay district
            - Angor district
            - Baysun district
            - Bandikhan district
    PaymentListResponse:
