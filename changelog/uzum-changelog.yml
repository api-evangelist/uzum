- api: Uzum Fiscalization
  date: '2024-03-01'
  version: v2
  breaking: true
  title: Mandatory digital product labeling
  highlights: >-
    A decree of the Republic of Uzbekistan made product labels mandatory when fiscalizing
    receipts for tobacco, alcoholic beverages, beer products, household appliances and
    electronics, pharmaceuticals, and water and soft drinks. A new `labels` array was added to
    the `items` collection on /v2/receipt and /v2/refund_receipt. Requests omitting labels for
    a listed category are rejected and the receipt is not fiscalized.
  source: https://developer.uzumbank.uz/en/fiscalization
