- api: Uzum Fast Pay
  kind: behavioural test note
  values:
  - condition: Card in Safe Mode (error 416)
    detail: >-
      New users must complete 3 payments in the Uzum Bank app before Safe Mode is lifted; for
      existing users Safe Mode must be disabled. This is a real state a test account will hit.
  source: https://developer.uzumbank.uz/en/fastpay
time_simulation:
  supported: false
  note: No test clocks or time-travel fixtures are published on any Uzum product.
fixture_tooling:
  supported: partial
  note: >-
    Postman collections and PDF test-case scripts stand in for fixture tooling; there is no
    trigger API for forcing a decline, a timeout or a settlement event.
